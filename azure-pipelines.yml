trigger:
  branches:
    include:
      - feature

pool:
  vmImage: 'ubuntu-22.04'

variables:
  pythonVersion: '3.12'
  acrLoginServer: 'apacheapp.azurecr.io'
  imageRepository: 'flask-app'
  tag: '$(Build.BuildId)'

stages:

# ============================================================
# CI: Build and Test
# ============================================================

- stage: Build_And_Test
  displayName: 'Build & Test'

  jobs:
  - job: Build

    steps:

    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        python -m py_compile app.py
      displayName: 'Compile Python code'

    - script: |
        docker compose build
      displayName: 'Build Docker images'

    # - script: |
    #     set -e

    #     docker compose up -d

    #     echo "Waiting for containers to start..."
    #     sleep 10

    #     echo "Testing Apache reverse proxy..."
    #     curl --fail http://127.0.0.1:8080

    #     echo "Integration test successful"

    #     docker compose down
    #   displayName: 'Integration test via Docker Compose'

    - script: |
        docker compose down || true
      displayName: 'Cleanup Docker containers'
      condition: always()


# ============================================================
# CD: Build and Push Flask Image to ACR
# ============================================================

- stage: Push_Image
  displayName: 'Push Image to ACR'

  dependsOn: Build_And_Test

  condition: succeeded()

  jobs:
  - job: PushToACR

    steps:

    - task: Docker@2
      displayName: 'Build and Push Flask Image to ACR'

      inputs:
        containerRegistry: 'apacheapp-azure-connection'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'

        tags: |
          $(tag)
          latest


# ============================================================
# CD: Deploy Image to Azure Web App
# ============================================================

- stage: Deploy
  displayName: 'Deploy to Azure Web App'

  dependsOn: Push_Image

  condition: succeeded()

  jobs:
  - deployment: DeployWebApp

    displayName: 'Deploy Flask Container'

    environment: 'production'

    strategy:
      runOnce:
        deploy:

          steps:

          - task: AzureWebAppContainer@1
            displayName: 'Deploy Image to Web App'

            inputs:
              azureSubscription: 'apacheapp-arm-connection'
              appName: 'apacheapp-webapp'
              containers: '$(acrLoginServer)/$(imageRepository):$(tag)'