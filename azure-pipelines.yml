trigger:
  branches:
    include:
      - feature

pool:
  vmImage: 'ubuntu-22.04'

variables:
  pythonVersion: '3.12'
  # Name from Azure DevOps Project Settings -> Service Connections
  acrServiceConnection: 'YourAzureServiceConnectionName' 
  acrLoginServer: 'apacheapp.azurecr.io'
  imageRepository: 'apacheapp'
  tag: '$(Build.BuildId)'
  # Name of your Azure App Service for Containers
  webAppName: 'YourAzureWebAppName'                     

stages:

# ============================================================
# CI: Build, Test, and Package Configurations
# ============================================================
- stage: Build_And_Test
  displayName: 'Build & Test'
  jobs:
  - job: Build
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        python -m py_compile app.py
      displayName: 'Compile Python code'

    # Build and tag specifically for ACR format
    - script: |
        docker build -t $(acrLoginServer)/$(imageRepository):$(tag) -t $(acrLoginServer)/$(imageRepository):latest .
      displayName: 'Build Docker Image for ACR'

    # Prepares docker-compose and apache.conf so they can pass to the CD Deployment stage
    - task: CopyFiles@2
      displayName: 'Copy Docker & Apache Configuration Artifacts'
      inputs:
        Contents: |
          docker-compose.yml
          apache.conf
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # Publishes the config files to Azure DevOps cloud storage
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Deployment Configurations'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ============================================================
# CD: Push Flask Image to ACR
# ============================================================
- stage: Push_Image
  displayName: 'Push Image to ACR'
  dependsOn: Build_And_Test
  condition: succeeded()
  jobs:
  - job: Push
    steps:
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: '$(acrServiceConnection)'

    - script: |
        docker push $(acrLoginServer)/$(imageRepository):$(tag)
        docker push $(acrLoginServer)/$(imageRepository):latest
      displayName: 'Push Image to ACR'

# ============================================================
# CD: Multi-Container Deploy to Azure Web App
# ============================================================
- stage: Deploy
  displayName: 'Deploy Multi-Container App'
  dependsOn: Push_Image
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Web App'
    environment: 'production' # Track history inside Azure DevOps Environments
    strategy:
      runOnce:
        deploy:
          steps:
          # Pulls the docker-compose & apache.conf configuration assets saved during CI
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Deployment Configurations'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          # Updates Azure with your multi-container topology
          - task: AzureWebAppContainer@1
            displayName: 'Azure Web App Multi-Container Deploy'
            inputs:
              azureSubscription: '$(acrServiceConnection)'
              appName: '$(webAppName)'
              multicontainerConfigFile: '$(System.ArtifactsDirectory)/drop/docker-compose.yml'
